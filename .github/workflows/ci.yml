name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_gui_suite:
        description: "Also try the real game test suite on the hosted runner (experimental)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (no game window needed)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build everything and run the tests that need no window
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_and_test.ps1

  gui-suite-experiment:
    name: Real game suite (experimental)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gui_suite }}
    needs: build-and-test
    runs-on: windows-latest
    timeout-minutes: 30
    # A failure here is information about the hosted runner, not a broken project.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and run the real game suite
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build_and_test.ps1 -Full
